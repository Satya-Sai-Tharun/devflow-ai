[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "devflow-api"
version = "0.1.0"
description = "DevFlow AI FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
devflow-api = "devflow_api.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["devflow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires a dedicated local PostgreSQL test database"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["devflow_api", "tests"]
extraPaths = ["."]
